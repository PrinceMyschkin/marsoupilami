<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import GUI from 'lil-gui';

// ============================================================================
//  GEOMETRY PARAMETERS (metres)
// ============================================================================
const G = {
  H: 13.0,          // membrane height at tether attachment points (flat tethered plateau)
  bulge: 0.35,      // pillow bulge of membrane between attachment points
  cell: 2.0,        // attachment grid / water-pillow cell size
  anchor: 10.0,     // anchor (footing) spacing; each bundle serves a 10 x 10 m patch = 25 tethers
  Rp: 18.0,         // radius of tethered, flat plateau
  arcTop: 15*Math.PI/180,   // edge arc slope where it leaves the plateau
  arcGround: 60*Math.PI/180,// edge arc slope where it meets the ground (no vertical walls)
  layerH: 1.0,      // water per pillow layer
  hookGap: 0.15,    // gap membrane -> top of first pillow (hook strap)
};
function setHeight(H){   // edge arc keeps its angles, so the footprint grows with height
  G.H = H;
  G.rho = G.H / (Math.cos(G.arcTop) - Math.cos(G.arcGround));            // edge arc radius
  G.R = G.Rp + G.rho * (Math.sin(G.arcGround) - Math.sin(G.arcTop));     // footprint radius
}
setHeight(G.H);
const H0 = G.H, R0 = G.R;

function baseHeight(r){
  if (r <= G.Rp) return G.H;
  const d = r - G.Rp;
  const s = Math.sin(G.arcTop) + d / G.rho;
  if (s >= Math.sin(G.arcGround)) return 0;
  return Math.max(0, G.H - G.rho * (Math.cos(G.arcTop) - Math.sqrt(1 - s*s)));
}
function roofHeight(x, z){
  const r = Math.hypot(x, z);
  let y = baseHeight(r);
  const f = THREE.MathUtils.smoothstep(G.Rp + 1.0 - r, 0, 1.0); // bulges only on tethered plateau
  if (f > 0) y += f * G.bulge * Math.abs(Math.sin(Math.PI*(x-1)/2) * Math.sin(Math.PI*(z-1)/2));
  return y;
}

// ============================================================================
//  PHYSICS: pressure
// ============================================================================
const P = { atm: 101.325, pin: 0.85*101.325, pout: 0.61, g: 3.711, rho: 1000 };

// ============================================================================
//  OPTICS: Pope & Fry (1997) pure-water absorption a(λ) [1/m], 400–700 nm
// ============================================================================
const WL = [];  for (let l=400; l<=700; l+=10) WL.push(l);
const A_WATER = [0.00663,0.00473,0.00454,0.00495,0.00635,0.00922,0.00979,0.01060,0.01270,0.01500,
                 0.02040,0.03250,0.04090,0.04340,0.04740,0.05650,0.06190,0.06950,0.08960,0.13510,
                 0.22240,0.26440,0.27550,0.29160,0.31080,0.34000,0.41000,0.43900,0.46500,0.51600,0.62400];
const N_WATER = 1.333;
const T_MEMBRANE = 0.92;   // ETFE-type laminate, visible transmittance ~90–95 %
const T_BAG = 0.97;        // per pillow: 2 thin film walls (water/film interfaces have ~no Fresnel loss)
// ---- light tunnels (optional): one large perforated Al funnel per tunnel (thin gap membrane → pillows)
//      -> specular aluminium pipe through the pillow stack -> diffuser
const PIPE_RHO = 0.98;     // specular reflectance per bounce (enhanced Al, e.g. Alanod MIRO-SILVER ≈98 %; Solatube Spectralight Infinity claims 99.7 %)
const PIPE_D = 1.6, DIFFUSER_T = 0.95;
const FUNNEL_RHO = 0.93;   // effective funnel reflectance: polished Al ≈0.95 per bounce × ~1.5 bounces
const FUNNEL_SLOPE = 15*Math.PI/180;   // shallow walls so the funnel fits a thin gap; pillows below hang lower by the local funnel depth
const THROAT_H = 0.3;      // square-to-round throat from the funnel mouth (2×2 m cell) into the Ø1.6 m pipe
function pipeT(len, zen){ if (len <= 0) return 1; return Math.pow(PIPE_RHO, len*Math.tan(Math.min(zen, 1.55))/PIPE_D); }
function pipeTdiffuse(len){ // cosine-weighted isotropic sky
  if (len <= 0) return 1; let s=0, w=0; const N=60;
  for (let k=0;k<N;k++){ const th=(k+0.5)/N*Math.PI/2, ww=Math.cos(th)*Math.sin(th); s+=ww*pipeT(len, th); w+=ww; } return s/w; }
// CIE 1931 CMF analytic fit (Wyman, Sloan & Shirley 2013)
const g3 = (x,m,s1,s2)=>{const t=(x-m)/(x<m?s1:s2);return Math.exp(-0.5*t*t);};
const cmf = l => [
  1.056*g3(l,599.8,37.9,31.0)+0.362*g3(l,442.0,16.0,26.7)-0.065*g3(l,501.1,20.4,26.2),
  0.821*g3(l,568.8,46.9,40.5)+0.286*g3(l,530.9,16.3,31.1),
  1.217*g3(l,437.0,11.8,36.0)+0.681*g3(l,459.0,26.0,13.8)];
const planck = l => { const lm=l*1e-9; return 1/(lm**5*(Math.exp(1.4388e-2/(lm*5778))-1)); };
const W = WL.map(l => {               // per-wavelength weights for R,G,B (linear sRGB), Y and PAR photons
  const S = planck(l), [x,y,z] = cmf(l);
  return { r:S*( 3.2406*x-1.5372*y-0.4986*z), g:S*(-0.9689*x+1.8758*y+0.0415*z),
           b:S*( 0.0557*x-0.2040*y+1.0570*z), Y:S*y, par:S*l };
});
const SUMW = W.reduce((a,w)=>({r:a.r+w.r,g:a.g+w.g,b:a.b+w.b,Y:a.Y+w.Y,par:a.par+w.par}),{r:0,g:0,b:0,Y:0,par:0});
function bandT(Tl){ // Tl: array of spectral transmittance -> weighted channel transmittances
  const o={r:0,g:0,b:0,Y:0,par:0};
  W.forEach((w,i)=>{o.r+=w.r*Tl[i];o.g+=w.g*Tl[i];o.b+=w.b*Tl[i];o.Y+=w.Y*Tl[i];o.par+=w.par*Tl[i];});
  for (const k in o) o[k]=Math.max(0,o[k]/SUMW[k]);
  return o;
}
// path factor in water for incidence zenith angle θa (refraction at the film/water interface)
const pathFactor = th => 1/Math.sqrt(1 - (Math.sin(th)/N_WATER)**2);
function waterT(depth, sunElev){
  const direct = bandT(A_WATER.map(a => Math.exp(-a*depth*pathFactor(Math.PI/2 - Math.max(sunElev, 0.01)))));
  // isotropic sky: cosine-weighted hemisphere integral
  const N=24, dif=new Array(WL.length).fill(0); let ws=0;
  for (let k=0;k<N;k++){ const th=(k+0.5)/N*Math.PI/2, w=Math.cos(th)*Math.sin(th); ws+=w;
    const pf=pathFactor(th); A_WATER.forEach((a,i)=>dif[i]+=w*Math.exp(-a*depth*pf)); }
  const diffuse = bandT(dif.map(v=>v/ws));
  return { direct, diffuse };
}

// ============================================================================
//  SUN & MARS ATMOSPHERE
// ============================================================================
const S0 = 590;   // W/m² top of Mars atmosphere at mean distance (1361 / 1.524²)
function sunVector(hours, latDeg, declDeg){
  const H=(hours-12)*15*Math.PI/180, f=latDeg*Math.PI/180, d=declDeg*Math.PI/180;
  const E=-Math.cos(d)*Math.sin(H), N=Math.sin(d)*Math.cos(f)-Math.cos(d)*Math.sin(f)*Math.cos(H),
        U=Math.sin(d)*Math.sin(f)+Math.cos(d)*Math.cos(f)*Math.cos(H);
  return new THREE.Vector3(E, U, -N).normalize();   // x = east, y = up, z = south
}
function irradiance(mu, tau){   // mu = sin(elevation)
  if (mu <= 0) { const tw = S0*0.012*THREE.MathUtils.smoothstep(mu, -0.3, 0); return {dni:0, dir:0, dif:tw, glob:tw}; }
  const m = Math.max(mu, 0.035), tr = Math.exp(-tau/m);
  const dni = S0*tr, dir = dni*mu, dif = S0*mu*(1-tr)*0.75;  // dust: high single-scatter albedo, forward scattering
  return { dni, dir, dif, glob: dir+dif };
}
const LUM_EFF = 100;  // lm/W, broadband sunlight
const PAR_PER_W = 2.06; // µmol photons PAR per J of broadband sunlight

// ============================================================================
//  RENDERER / SCENE
// ============================================================================
const params = {
  height: 22.0, layers: 8, pillows: true, platform: true, tunnels: false, tunnelSpacing: 10, funnelCover: 100, perfOpen: 20, membrane: true, tethers: true, cutaway: true, labels: true,
  time: 11.0, pathLights: 'auto', lat: 35, decl: 0, tau: 0.5, exposure: 1.0, view: 'overview', ledW: 0, ledHours: 16, ledAuto: true, ledMix620: 0.40,
};
const qs = new URLSearchParams(location.search);
for (const [k,v] of qs) if (k in params) params[k] = (typeof params[k]==='number') ? parseFloat(v) : (typeof params[k]==='boolean' ? v==='1'||v==='true' : v);
// info=0 hides the panel (handled later). info=summary | info=full selects the left-panel mode; default is Summary (for sharing).
let infoMode = 'summary';
{ const q = qs.get('info'); if (q==='full' || q==='physics') infoMode = 'full'; else if (q==='summary') infoMode = 'summary'; }

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
RectAreaLightUniformsLib.init();
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style,{position:'absolute',top:'0',left:'0',pointerEvents:'none'});
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb08060, 0.0016);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 3000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// shared uniforms for "light passed through water" on interior materials
const TINT = { dir: { value: new THREE.Color(1,1,1) }, dif: { value: new THREE.Color(1,1,1) } };
function interior(mat){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTintDir = TINT.dir; sh.uniforms.uTintDif = TINT.dif;
    const lfb = THREE.ShaderChunk.lights_fragment_begin.replace('getDirectionalLightInfo( directionalLight, directLight );',
      'getDirectionalLightInfo( directionalLight, directLight ); directLight.color *= uTintDir;');
    sh.fragmentShader = 'uniform vec3 uTintDir;\nuniform vec3 uTintDif;\n' + sh.fragmentShader
      .replace('#include <lights_fragment_begin>', lfb)
      .replace('#include <aomap_fragment>',
      `#include <aomap_fragment>
       reflectedLight.indirectDiffuse *= uTintDif; reflectedLight.indirectSpecular *= uTintDif;`);
  };
  mat.customProgramCacheKey = () => 'interiorTint';
  return mat;
}
// cut plane: keep z <= 1 (the cell boundary just in front of the centre row)
const CUT_Z = 1.0;
const cutPlane = new THREE.Plane(new THREE.Vector3(0,0,-1), CUT_Z);
const clipList = [];
function clippable(mat){ clipList.push(mat); return mat; }

// ---------------------------------------------------------------- lights
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-45, right:45, top:45, bottom:-45, near:1, far:300 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xd9a066, 0x5a3420, 1);
scene.add(hemi);
// Two-channel red grow LEDs just under the pillows (one mixed luminous ceiling over the plateau).
// 620 nm: orange-red, closer to the eye's red / better colour rendering (high lm/W).
// 660 nm: deep red, most efficient for photosynthesis (chlorophyll peak, higher wall-plug and µmol/J).
// Default mix 40 % 620 / 60 % 660: most optical watts stay on the plant peak, but enough 620 that
// auto-balance can restore the visual red share within 100 W/m² at typical 3–8 layer stacks, and
// the interior looks less like a deep-red darkroom. Channel weights r,g,b are this model's linear
// sRGB-band increments per optical W/m², scaled so 660 nm adds (1,0,0) as before; 620 nm adds
// 5.23 to R per watt (ratio of the CMF→sRGB red values at the two wavelengths).
const LED_MAX = 100;
const LED_TARGET_RED_SHARE = 1/3;
const LED_CH = {
  620: { nm:620, umol:5.18, eta:0.38, lm:255, r:5.230, g:0, b:0, color: new THREE.Color(0xff5800) },
  660: { nm:660, umol:5.52, eta:0.52, lm:44.5, r:1,     g:0, b:0, color: new THREE.Color(0xff0500) },
};
function ledMix620(){ return THREE.MathUtils.clamp(params.ledMix620 ?? 0.40, 0, 1); }
function ledSplit(total){ const f=ledMix620(), t=Math.max(0,total); return { f, w620:t*f, w660:t*(1-f) }; }
function ledAddPerWatt(){ const f=ledMix620(), a=LED_CH[620], b=LED_CH[660];
  return { r:f*a.r+(1-f)*b.r, g:f*a.g+(1-f)*b.g, b:f*a.b+(1-f)*b.b }; }
function ledParPerWatt(){ const f=ledMix620(); return f*LED_CH[620].umol + (1-f)*LED_CH[660].umol; }
function ledLuxOf(w620, w660){ return w620*LED_CH[620].lm + w660*LED_CH[660].lm; }
function ledElecOf(w620, w660){ return w620/LED_CH[620].eta + w660/LED_CH[660].eta; }
const ledLight = new THREE.RectAreaLight(0xff2a00, 0, 2*G.Rp, 2*G.Rp);
ledLight.visible = false; scene.add(ledLight);
function rectFormFactor(a, b, d){ // E/(πL) on the axis of a Lambertian 2a×2b rectangle at distance d
  d = Math.max(d, 0.05); const x=a/d, y=b/d, sx=Math.sqrt(1+x*x), sy=Math.sqrt(1+y*y);
  return (x/sx*Math.atan(y/sx) + y/sy*Math.atan(x/sy)) / Math.PI;
}
function updateLedLight(){
  const y = Math.max(0.6, (stats.waterBottom ?? (G.H - G.hookGap)) - 0.12);
  // RectAreaLight emits along local −Z; lookAt() would aim +Z, so rotate instead of lookAt.
  ledLight.position.set(0, y, 0);
  ledLight.rotation.set(-Math.PI/2, 0, 0);
  const side = 2*(stats.canopyR || G.Rp); ledLight.width = side; ledLight.height = side;
  const F = rectFormFactor(side/2, side/2, y);
  const { f, w620, w660 } = ledSplit(params.ledW);
  const col = new THREE.Color(
    f*LED_CH[620].color.r + (1-f)*LED_CH[660].color.r,
    f*LED_CH[620].color.g + (1-f)*LED_CH[660].color.g,
    f*LED_CH[620].color.b + (1-f)*LED_CH[660].color.b);
  ledLight.color.copy(col);
  // same radiometric scale as the sun: DirectionalLight intensity 3.2 ≡ S0 W/m² on a facing surface.
  // RectAreaLight.intensity is nits; floor irradiance at the centre is π·L·F. Slider = W/m² at floor level.
  const E = Math.max(0, params.ledW) * (3.2 / S0);
  ledLight.intensity = (params.ledW > 0 && F > 1e-6) ? E / (Math.PI * F) : 0;
  ledLight.visible = params.ledW > 0;
}
let cLedW = null;          // filled when the GUI is built
let ledAutoState = { raw:0, applied:0, clamped:false, targetShare: LED_TARGET_RED_SHARE, outShare: LED_TARGET_RED_SHARE, inShare:0, mixShare:0, rgb:{r:0,g:0,b:0}, f:0.4, w620:0, w660:0 };
function waterFilteredRGB(I, w, bag, tm, fracDir){
  const tT = params.tunnels ? (fracDir*(tm.kDir||0) + (1-fracDir)*(tm.kDif||0)) : 0;
  const keep = params.tunnels ? (tm.keep ?? 1) : 1;
  const ch = c => keep*(fracDir*w.direct[c] + (1-fracDir)*w.diffuse[c])*bag * I.glob + tT * I.glob;
  return { r: ch('r'), g: ch('g'), b: ch('b') };
}
function ledWForWhiteBalance(rgb){           // 0 when there is no sunlight (night)
  if (rgb.r + rgb.g + rgb.b <= 1e-9) return 0;
  // Restore R/(R+G+B) = 1/3 after adding the current 620/660 mix: W = (G+B−2R) / (3 a_r − a_r−a_g−a_b)
  const a = ledAddPerWatt(), den = 3*a.r - (a.r+a.g+a.b);
  if (Math.abs(den) < 1e-9) return 0;
  return (rgb.g + rgb.b - 2*rgb.r) / den;
}
function computeLedAuto(I, w, bag, tm, fracDir){

  const raw = ledWForWhiteBalance(rgb);

// tunnel lattice: one pipe every S m (S/2 odd so funnel rims fall on the 2 m cell boundaries); square funnel of width w ≤ S
function tunnelLayout(L){
  const T = { list: [], tunOf: new Map(), drop: new Map(), S: 0, w: 0, m: G.cell/2, dep: 0, funnelCells: 0 };
  if (!params.tunnels || L <= 0) return T;
  const S = 2*(2*Math.round((params.tunnelSpacing/2 - 1)/2) + 1);
  const w = Math.min(S, Math.max(2, 2*(2*Math.round((S*Math.sqrt(params.funnelCover/100)/2 - 1)/2) + 1)));
  Object.assign(T, { S, w, dep: Math.tan(FUNNEL_SLOPE)*Math.max(0, w/2 - T.m) });
  T.dropAt = d => d <= T.m ? T.dep : T.dep*Math.max(0, 1 - (d - T.m)/Math.max(1e-6, w/2 - T.m));
  const key = (x,z) => x+','+z, byKey = new Map(); cells.forEach((c,i) => byKey.set(key(c.x,c.z), i));
  const md = v => ((v % S) + S) % S;
  cells.forEach((c,i) => { if (md(c.x)===0 && md(c.z)===0){ const t = { x:c.x, z:c.z, idx:i }; T.list.push(t); T.tunOf.set(i, t); } });
  const tunAt = new Map(T.list.map(t => [key(t.x,t.z), t]));
  cells.forEach((c,i) => { const tx = Math.round(c.x/S)*S, tz = Math.round(c.z/S)*S, t = tunAt.get(key(tx,tz)); if (!t) return;
    const ch = Math.max(Math.abs(c.x-tx), Math.abs(c.z-tz)); if (ch + 1 > w/2) return;
    T.funnelCells++; if (ch > 0) T.drop.set(i, T.dropAt(ch - 1)); });

}

      pos.push(X, baseHeight(Math.hypot(X,Z)) - 0.08 - T.dropAt(Math.max(Math.abs(dx),Math.abs(dz))), Z); uv.push(X, Z); }
    for (let j=0;j<N;j++) for (let i=0;i<N;i++){ const qx=-h+i+0.5, qz=-h+j+0.5;

      const X=t.x+qx, Z=t.z+qz; if (!T.byKey.has(T.key(2*Math.round(X/2), 2*Math.round(Z/2)))) continue;   // only over existing pillow cells

function isaRatio(hkm){
  const h=hkm*1000;
  if (h<=11000) return Math.pow(1-2.25577e-5*h, 5.25588);
  if (h<=20000) return 0.223361*Math.exp(-(h-11000)/6341.62);
  if (h<=32000) return 0.054033*Math.pow(1+(h-20000)/216650, -34.1632);
  return 0.0085666*Math.pow(1+2.8*(h-32000)/228650, -12.2011);

    <div class="src">Two-channel luminous ceiling just under the pillow stack. LEDs span the underside of the pillow canopy (${fmt(canopyA,0)} m²), which is the grid of pillow cells — less than the dome footprint (${fmt(footprintA,0)} m²) because the edge arc has no pillows where the membrane is too low. The top slider is total optical W/m² at floor level (area-light intensity is compensated for ceiling height). The mix slider is the fraction of those watts at 620 nm (the rest is 660 nm); default 40 % / 60 %. 620 nm is orange-red: closer to the eye’s red, much higher luminous efficacy (this model’s CIE 1931 ȳ(620 nm)×683 = 255 lm/W; CIE V(620) ≈ 0.381 → 260 lm/W) and about 5.2× more effective per watt in the model’s sRGB red band, so it does the work of visual white balance and colour rendering. 660 nm is deep red: closest to the chlorophyll absorption peak, slightly more photons per joule (5.52 vs 5.18 µmol/J) and a higher wall-plug efficiency. Auto-balance (Earth-like white): unfiltered sunlight is (1,1,1) in the R/G/B bands, so its red share is 1/3. The unique total W that restores that share at the current mix is used, then clamped to 0–100 W/m²; with no sunlight the formula gives 0, so the LEDs switch off at night. The mix slider stays user-set during auto (it is a design choice, not a power level). Photoperiod: default 16 h/sol (hours × 3600 s) when auto is off; when auto is on, DLI integrates the auto setpoint over one 24.66 h sol (same time grid as the sunlight DLI) and the hours slider is unused. Wall-plug assumptions: 38 % at 620 nm (mid of the 35–40 % range for orange-red diodes plus driver) and 52 % at 660 nm (mid of 50–55 %).</div>`;

  const domeLine = `Dome: Ø ${fmt(2*G.R)} m · ${fmt(L*G.layerH,0)} m water sky · ${stats.waterBottom>0.3 ? fmt(stats.waterBottom,0)+' m clear' : '0 m clear'}`;
  const forcesLine = `Forces: ${fmt(dp,1)} kPa air ↑ = ${fmt(waterKPa,1)} kPa water ↓ + ${fmt(net,1)} kPa tethers ↓`;
  let shieldLine;

// ============================================================================
//  CAMERA PRESETS & GUI
// ============================================================================
// presets scale with the current geometry (k: footprint, h: height relative to the 13 m reference; H0/R0 stay at that framing, not the 22 m startup default)
const VIEWS = {
  overview: (k,h)=>({ pos:[30*k, 13*h, 38*k], tgt:[-3, 6*h, -6], cut:true }),
  section:  (k,h)=>({ pos:[0.5, 6.0*h, 13*Math.max(1,h*0.8)], tgt:[-7.5, G.H*0.72, -2], cut:true }),
  interior: (k,h)=>({ pos:[2.0, 1.65, 1.5], tgt:[-0.5, 5.2, -9], cut:false, fov:68 }),
  exterior: (k,h)=>({ pos:[46*k, 17*h, 50*k], tgt:[0, 4*h, 0], cut:false }),
  house:    (k,h)=>({ pos:[-8.2, 5.6, -3.6], tgt:[-10, 3.9, -10], cut:false }),
  funnel:   (k,h)=>({ pos:[7.5, G.H-4.2, 9.5], tgt:[0, G.H-1.6, 0], cut:true }),   // close-up of a tunnel funnel in section
  platform: (k,h)=>{ const y = platformDeckY(Math.max(plateauClearHeight(), 26));
    return { pos:[16.5, y+2.6, 12.5], tgt:[0.2, y+1.4, -0.6], cut:false, fov:50 }; },
};
function applyCamera(name){
  const f = VIEWS[name]; if (!f) return null; const v = f(G.R/R0, G.H/H0);
  camera.position.set(...v.pos); controls.target.set(...v.tgt); camera.fov = v.fov || 50; camera.updateProjectionMatrix(); controls.update();
  return v;
}
function setView(name){
  const v = applyCamera(name); if (!v) return;
  params.cutaway = v.cut; gui?.controllersRecursive().forEach(c=>c.updateDisplay());
  rebuild();
}
// ---------------------------------------------------------------- loading overlay
const loadingEl = document.getElementById('loading'), loadBar = loadingEl.querySelector('.bar i'), loadMsg = loadingEl.querySelector('.msg');
const HOLD_LOADING = qs.get('loading') === 'hold';
const nextPaint = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));   // let the overlay paint before sync work
async function step(msg, frac, fn){ loadMsg.textContent = msg; loadBar.style.width = Math.round(frac*100)+'%'; await nextPaint(); fn && fn(); }
let queue = Promise.resolve();
function withLoading(kind, steps){
  queue = queue.then(async () => {
    loadingEl.className = kind; loadingEl.style.display = 'flex';
    for (const [msg, frac, fn] of steps) await step(msg, frac, fn);
    await step('Done', 1, null);
    if (!HOLD_LOADING) loadingEl.style.display = 'none';
  }).catch(e => { console.error(e); loadingEl.style.display = 'none'; });
  return queue;
}
const structureSteps = () => [
  ['Shaping terrain', 0.1, () => { setHeight(params.height); updateGround(); placeRocks(); }],
  [`Building membrane & edge arc (${fmtH(params.height)} m)`, 0.35, buildMembrane],
  ['Laying out pillow grid', 0.6, () => { computeCells(cells); buildAnchors(); buildScaleBar(); }],
  ['Hanging water pillows & tethers', 0.85, rebuild],
];
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const rebuildHeight = debounce(() => withLoading('rebuild', [...structureSteps(),
  ['Adjusting camera', 0.95, () => { if (['overview','exterior','section','platform'].includes(params.view)) applyCamera(params.view); }]]), 350);
function rebuildStructure(){
  setHeight(params.height); updateGround(); placeRocks();
  buildMembrane(); computeCells(cells); buildAnchors(); buildScaleBar();
  if (['overview','exterior','section','platform'].includes(params.view)) applyCamera(params.view);
  rebuild();
}
window.__mars = { params, get rebuildHeight(){ return rebuildHeight; }, get rebuildLayers(){ return rebuildLayers; }, rebuild, rebuildStructure, plateauClearHeight, platformDeckY, platformGroup, camera, controls, applyCamera, get ledAutoState(){ return ledAutoState; }, computeLedAuto, updateLight, get infoMode(){ return infoMode; }, setInfoMode, get summary(){ return window.__summary; }, get anchors(){ return anchors; }, get stats(){ return stats; }, tetherCount, buildAnchors };   // test hook
const rebuildLayers = debounce(() => withLoading('rebuild', [['Hanging water pillows', 0.5, rebuild]]), 250);
const gui = new GUI({ title: 'MARSOUPILAMI controls' });
gui.add(params, 'height', H_MIN, H_MAX, 0.5).name('membrane height (m)').onChange(rebuildHeight);
gui.add(params, 'layers', 0, MAXL, 1).name('water pillow layers').onChange(rebuildLayers);
gui.add(params, 'pillows').name('show water pillows').onChange(rebuild);
gui.add(params, 'platform').name('Hanging platform (auto >25 m)').onChange(rebuild);
const fL = gui.addFolder('Red LEDs (620 + 660 nm)');
cLedW = fL.add(params, 'ledW', 0, 100, 1).name('Red LEDs (W/m²)').onChange(() => { if (!params.ledAuto) updateLight(); });
fL.add(params, 'ledMix620', 0, 1, 0.01).name('620/660 mix (fraction 620 nm)').onChange(updateLight);
fL.add(params, 'ledAuto').name('Auto-balance (Earth-like white)').onChange(() => { if (params.ledAuto) cLedW.disable(); else cLedW.enable(); updateLight(); });

if (params.ledAuto) cLedW.disable();
const fT = gui.addFolder('Light tunnels (skylights)');
fT.add(params, 'tunnels').name('light tunnels on').onChange(() => rebuildLayers());

fT.add(params, 'perfOpen', 0, 60, 1).name('perforation open %').onChange(updateLight);
fT.hide();   // tunnels stay available via ?tunnels=1, but the folder is hidden from the control panel
gui.add(params, 'membrane').name('show membrane').onChange(rebuild);
gui.add(params, 'tethers').name('show tethers').onChange(rebuild);
gui.add(params, 'cutaway').name('cutaway section').onChange(rebuild);
gui.add(params, 'labels').name('labels').onChange(rebuild);
const fS = gui.addFolder('Sun / Mars time');
fS.add(params, 'time', 0, 24, 0.05).name('local solar time (h)').onChange(updateLight);
fS.add(params, 'pathLights', ['auto','on','off']).name('night lights (path + uplights)').onChange(updateLight);
fS.add(params, 'lat', -60, 60, 1).name('latitude °N').onChange(updateLight);
fS.add(params, 'decl', -25.2, 25.2, 0.1).name('solar declination °').onChange(updateLight);
fS.add(params, 'tau', 0.2, 3, 0.05).name('dust optical depth τ').onChange(updateLight);
fS.add(params, 'exposure', 0.2, 4, 0.05).name('camera exposure').onChange(updateLight);
gui.add(params, 'view', Object.keys(VIEWS).filter(k => k !== 'funnel')).name('camera preset').onChange(setView);
let animT = null;
gui.add({ play(){ if (animT){ clearInterval(animT); animT=null; } else animT=setInterval(()=>{ params.time=(params.time+0.05)%24; fS.controllers[0].updateDisplay(); updateLight(); }, 50); } }, 'play').name('▶ animate sol');

document.getElementById('hide').onclick = () => { const i=document.getElementById('info'); i.style.display = i.style.display==='none'?'':'none'; };
document.getElementById('infoToggle').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]'); if (!b) return;
  setInfoMode(b.dataset.mode);
});
applyInfoModeChrome();
addEventListener('keydown', e => { if (e.key==='i') document.getElementById('hide').onclick(); });
addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });

const cutOverride = qs.has('cutaway') ? params.cutaway : null;
params.height = THREE.MathUtils.clamp(params.height, H_MIN, H_MAX);
params.layers = THREE.MathUtils.clamp(Math.round(params.layers), 0, MAXL);
if (qs.get('gui')==='0') gui.hide();
if (qs.get('info')==='0') document.getElementById('info').style.display='none';
loadingEl.className = '';
withLoading('', [...structureSteps(), ['Placing camera', 0.95, () => {
    setHeight(params.height); const v = applyCamera(params.view) || applyCamera('overview');
    params.cutaway = cutOverride !== null ? cutOverride : v.cut; gui.controllersRecursive().forEach(c=>c.updateDisplay()); rebuild(); }]])
  .then(() => {
    let frames = 0;
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      if (++frames === 3) window.__ready = true;
    });
