import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import GUI from 'lil-gui';
import { WebGLPathTracer, GradientEquirectTexture } from 'three-gpu-pathtracer';

// three-gpu-pathtracer 0.0.23 reads scene.backgroundRotation / environmentRotation (added in three r163).
// Polyfill them on r160 so we can keep the existing raster renderer unchanged.
(function polyfillSceneRotation(){
  const proto = THREE.Scene.prototype;
  if (!Object.getOwnPropertyDescriptor(proto, 'backgroundRotation')){
    Object.defineProperty(proto, 'backgroundRotation', {
      get(){ return this._ptBgRot || (this._ptBgRot = new THREE.Euler()); },
      set(v){ this._ptBgRot = v; },
    });
  }
  if (!Object.getOwnPropertyDescriptor(proto, 'environmentRotation')){
    Object.defineProperty(proto, 'environmentRotation', {
      get(){ return this._ptEnvRot || (this._ptEnvRot = new THREE.Euler()); },
      set(v){ this._ptEnvRot = v; },
    });
  }
})();

// ============================================================================
//  GEOMETRY PARAMETERS (metres)
// ============================================================================
const G = {
  H: 13.0,          // membrane height at tether attachment points (flat tethered plateau)
  bulge: 0.35,      // pillow bulge of membrane between attachment points
  cell: 2.0,        // attachment grid / water-pillow cell size
  anchor: 10.0,     // anchor (footing) spacing; each bundle serves a 10 x 10 m patch = 25 tethers
  Rp: 18.0,         // radius of tethered, flat plateau
  arcTop: 15*Math.PI/180,   // edge arc slope where it leaves the plateau
  arcGround: 60*Math.PI/180,// edge arc slope where it meets the ground (no vertical walls)
  layerH: 1.0,      // water per pillow layer
  hookGap: 0.15,    // gap membrane -> top of first pillow (hook strap)
};
const PW = G.cell - 0.14, PH = G.layerH - 0.05;   // pillow outer dims (1.86 x 0.95 x 1.86 m) -> 0.14 m gap for tether lines
function setHeight(H){   // edge arc keeps its angles, so the footprint grows with height
  G.H = H;
  G.rho = G.H / (Math.cos(G.arcTop) - Math.cos(G.arcGround));            // edge arc radius
  G.R = G.Rp + G.rho * (Math.sin(G.arcGround) - Math.sin(G.arcTop));     // footprint radius
}
setHeight(G.H);
const H0 = G.H, R0 = G.R;

function baseHeight(r){
  if (r <= G.Rp) return G.H;
  const d = r - G.Rp;
  const s = Math.sin(G.arcTop) + d / G.rho;
  if (s >= Math.sin(G.arcGround)) return 0;
  return Math.max(0, G.H - G.rho * (Math.cos(G.arcTop) - Math.sqrt(1 - s*s)));
}
function roofHeight(x, z){
  const r = Math.hypot(x, z);
  let y = baseHeight(r);
  const f = THREE.MathUtils.smoothstep(G.Rp + 1.0 - r, 0, 1.0); // bulges only on tethered plateau
  if (f > 0) y += f * G.bulge * Math.abs(Math.sin(Math.PI*(x-1)/2) * Math.sin(Math.PI*(z-1)/2));
  return y;
}

// ============================================================================
//  PHYSICS: pressure
// ============================================================================
const P = { atm: 101.325, pin: 0.85*101.325, pout: 0.61, g: 3.711, rho: 1000 };

// ============================================================================
//  OPTICS: Pope & Fry (1997) pure-water absorption a(λ) [1/m], 400–700 nm
// ============================================================================
const WL = [];  for (let l=400; l<=700; l+=10) WL.push(l);
const A_WATER = [0.00663,0.00473,0.00454,0.00495,0.00635,0.00922,0.00979,0.01060,0.01270,0.01500,
                 0.02040,0.03250,0.04090,0.04340,0.04740,0.05650,0.06190,0.06950,0.08960,0.13510,
                 0.22240,0.26440,0.27550,0.29160,0.31080,0.34000,0.41000,0.43900,0.46500,0.51600,0.62400];
const N_WATER = 1.333;
const T_MEMBRANE = 0.92;   // ETFE-type laminate, visible transmittance ~90–95 %
const T_BAG = 0.97;        // per pillow: 2 thin film walls (water/film interfaces have ~no Fresnel loss)
// ---- light tunnels (optional): one large perforated Al funnel per tunnel (thin gap membrane → pillows)
//      -> specular aluminium pipe through the pillow stack -> diffuser
const PIPE_RHO = 0.98;     // specular reflectance per bounce (enhanced Al, e.g. Alanod MIRO-SILVER ≈98 %; Solatube Spectralight Infinity claims 99.7 %)
const PIPE_D = 1.6, DIFFUSER_T = 0.95;
const FUNNEL_RHO = 0.93;   // effective funnel reflectance: polished Al ≈0.95 per bounce × ~1.5 bounces
const FUNNEL_SLOPE = 15*Math.PI/180;   // shallow walls so the funnel fits a thin gap; pillows below hang lower by the local funnel depth
const THROAT_H = 0.3;      // square-to-round throat from the funnel mouth (2×2 m cell) into the Ø1.6 m pipe
function pipeT(len, zen){ if (len <= 0) return 1; return Math.pow(PIPE_RHO, len*Math.tan(Math.min(zen, 1.55))/PIPE_D); }
function pipeTdiffuse(len){ // cosine-weighted isotropic sky
  if (len <= 0) return 1; let s=0, w=0; const N=60;
  for (let k=0;k<N;k++){ const th=(k+0.5)/N*Math.PI/2, ww=Math.cos(th)*Math.sin(th); s+=ww*pipeT(len, th); w+=ww; } return s/w; }
// CIE 1931 CMF analytic fit (Wyman, Sloan & Shirley 2013)
const g3 = (x,m,s1,s2)=>{const t=(x-m)/(x<m?s1:s2);return Math.exp(-0.5*t*t);};
const cmf = l => [
  1.056*g3(l,599.8,37.9,31.0)+0.362*g3(l,442.0,16.0,26.7)-0.065*g3(l,501.1,20.4,26.2),
  0.821*g3(l,568.8,46.9,40.5)+0.286*g3(l,530.9,16.3,31.1),
  1.217*g3(l,437.0,11.8,36.0)+0.681*g3(l,459.0,26.0,13.8)];
const planck = l => { const lm=l*1e-9; return 1/(lm**5*(Math.exp(1.4388e-2/(lm*5778))-1)); };
const W = WL.map(l => {               // per-wavelength weights for R,G,B (linear sRGB), Y and PAR photons
  const S = planck(l), [x,y,z] = cmf(l);
  return { r:S*( 3.2406*x-1.5372*y-0.4986*z), g:S*(-0.9689*x+1.8758*y+0.0415*z),
           b:S*( 0.0557*x-0.2040*y+1.0570*z), Y:S*y, par:S*l };
});
const SUMW = W.reduce((a,w)=>({r:a.r+w.r,g:a.g+w.g,b:a.b+w.b,Y:a.Y+w.Y,par:a.par+w.par}),{r:0,g:0,b:0,Y:0,par:0});
function bandT(Tl){ // Tl: array of spectral transmittance -> weighted channel transmittances
  const o={r:0,g:0,b:0,Y:0,par:0};
  W.forEach((w,i)=>{o.r+=w.r*Tl[i];o.g+=w.g*Tl[i];o.b+=w.b*Tl[i];o.Y+=w.Y*Tl[i];o.par+=w.par*Tl[i];});
  for (const k in o) o[k]=Math.max(0,o[k]/SUMW[k]);
  return o;
}
// path factor in water for incidence zenith angle θa (refraction at the film/water interface)
const pathFactor = th => 1/Math.sqrt(1 - (Math.sin(th)/N_WATER)**2);
// ---- pillow shape -> water per cell and open (gap) area, used by mass, pressure, shielding and optics.
// The drawn cushion (pillowGeometry) is a sphere pushed towards a rounded box, PW × PH × PW on a
// G.cell × G.cell grid. The smooth shape it approximates has the vertical chord
//   d(x,z) = PH · (1 − |2x/PW|^(2/0.28) − |2z/PW|^(2/0.28))^(0.55/2)
// Integrated over one 2 × 2 m cell: water volume per pillow, covered (projected) area, open fraction
// (14 cm streets between the columns + rounded corners), and a chord histogram for Beer–Lambert.
const PILLOW = (() => {
  const N = 400, A = G.cell*G.cell, dA = A/(N*N), NB = 24, w = new Array(NB).fill(0), wd = new Array(NB).fill(0);
  let V = 0, Ap = 0;
  for (let i=0;i<N;i++) for (let j=0;j<N;j++){
    const x = -G.cell/2 + (i+0.5)*G.cell/N, z = -G.cell/2 + (j+0.5)*G.cell/N;
    const s = Math.pow(Math.abs(2*x/PW), 2/0.28) + Math.pow(Math.abs(2*z/PW), 2/0.28);
    if (s >= 1) continue;
    const d = PH*Math.pow(1 - s, 0.55/2), b = Math.min(NB-1, Math.floor(d/PH*NB));
    V += d*dA; Ap += dA; w[b] += dA; wd[b] += d*dA;
  }
  const chords = []; for (let b=0;b<NB;b++) if (w[b] > 0) chords.push({ d: wd[b]/w[b], w: w[b]/A });
  return { V, Ap, A, open: 1 - Ap/A, depth: V/A, meanChord: V/Ap, chords };
})();
// One pillow layer as a screen: a ray either passes a gap (no water, no film) or crosses one pillow
// (two film walls T_BAG + water chord d·pathFactor). Layers are treated as independent screens: an
// oblique ray drifts L·tanθ sideways, so it does not stay inside the 14 cm streets; only an exactly
// vertical ray would see the aligned gaps all the way down. Mean water path = PILLOW.depth per layer.
function layerTl(pf){
  return A_WATER.map(a => { let t = PILLOW.open; for (const c of PILLOW.chords) t += c.w*T_BAG*Math.exp(-a*c.d*pf); return t; });
}
const _difT = new Map();
function waterT(L, sunElev){   // L pillow layers (films included, membrane not); band-integrated R,G,B,Y,PAR
  const direct = bandT(layerTl(pathFactor(Math.PI/2 - Math.max(sunElev, 0.01))).map(t => Math.pow(t, L)));
  let diffuse = _difT.get(L);   // isotropic sky: cosine-weighted hemisphere; depends on L only
  if (!diffuse){
    const N=24, dif=new Array(WL.length).fill(0); let ws=0;
    for (let k=0;k<N;k++){ const th=(k+0.5)/N*Math.PI/2, wt=Math.cos(th)*Math.sin(th); ws+=wt;
      layerTl(pathFactor(th)).forEach((t,i)=>dif[i]+=wt*Math.pow(t, L)); }
    diffuse = bandT(dif.map(v=>v/ws)); _difT.set(L, diffuse);
  }
  return { direct, diffuse };
}

// ============================================================================
//  SUN & MARS ATMOSPHERE
// ============================================================================
const S0 = 590;   // W/m² top of Mars atmosphere at mean distance (1361 / 1.524²)
function sunVector(hours, latDeg, declDeg){
  const H=(hours-12)*15*Math.PI/180, f=latDeg*Math.PI/180, d=declDeg*Math.PI/180;
  const E=-Math.cos(d)*Math.sin(H), N=Math.sin(d)*Math.cos(f)-Math.cos(d)*Math.sin(f)*Math.cos(H),
        U=Math.sin(d)*Math.sin(f)+Math.cos(d)*Math.cos(f)*Math.cos(H);
  return new THREE.Vector3(E, U, -N).normalize();   // x = east, y = up, z = south
}
// Mars dust, solar band: single-scatter albedo and asymmetry (Wolff et al. 2009,
// Madeleine et al. 2011; mid-visible / solar-weighted values are ~0.93–0.95 and
// ~0.65–0.7). Surface broadband albedo ~0.2 (typical TES / Lambert mean).
const DUST_SSA = 0.94, DUST_G = 0.70, DUST_ALB = 0.20;
// Total downward flux at the surface (direct + diffuse) from a δ-Eddington
// two-stream (Joseph, Wiscombe & Weinman 1976; Meador & Weaver 1980).
// The beam in this solution is the δ-scaled “direct”; callers split off the
// true Beer–Lambert sun-disk (unscaled τ) and treat the rest as diffuse.
function dustTwoStreamDown(mu0, tau){
  mu0 = Math.min(Math.max(mu0, 1e-3), 1);
  const omega = Math.min(DUST_SSA, 0.999999), g = DUST_G, alb = DUST_ALB;
  const f = g*g;
  const taup = (1 - omega*f) * tau;
  let omegap = (1 - omega*f) > 1e-12 ? (1-f)*omega / (1 - omega*f) : 0;
  omegap = Math.min(omegap, 0.999999);
  const gp = g / (1 + g);
  const y1 = (7 - omegap*(4 + 3*gp))/4;
  const y2 = -(1 - omegap*(4 - 3*gp))/4;
  const y3 = (2 - 3*gp*mu0)/4;
  const y4 = 1 - y3;
  const lam = Math.sqrt(Math.max(y1*y1 - y2*y2, 0)) || 1e-8;
  let mu = mu0, den = lam*lam - 1/(mu*mu);
  if (Math.abs(den) < 1e-7){
    mu = mu0 * (mu0 > 0.5 ? 0.998 : 1.002);
    den = lam*lam - 1/(mu*mu);
    if (Math.abs(den) < 1e-7) den = den >= 0 ? 1e-7 : -1e-7;
  }
  const src = omegap * S0, invm = 1/mu;
  const P = src * ((y1 - invm)*y3 + y2*y4) / den;
  const Q = src * ((y1 + invm)*y4 + y2*y3) / den;
  const Rp = Math.abs(y2) < 1e-12 ? 0 : (y1 - lam)/y2;
  const Rm = Math.abs(y2) < 1e-12 ? 0 : (y1 + lam)/y2;
  const eLam = Math.exp(-Math.min(lam*taup, 80));
  const eSun = Math.exp(-Math.min(taup/mu, 80));
  const rhs = alb*(Q*eSun + S0*mu*eSun) - P*eSun;
  const a11 = Rp*eLam, a12 = Rm, b1 = -Q;
  const a21 = 1 - alb*Rp, a22 = eLam*(1 - alb*Rm), b2 = rhs;
  const det = a11*a22 - a12*a21;
  const U = Math.abs(det) < 1e-18 ? 0 : (b1*a22 - a12*b2)/det;
  const V = Math.abs(det) < 1e-18 ? 0 : (a11*b2 - b1*a21)/det;
  const downDif = U*Rp + V*Rm*eLam + Q*eSun;
  return Math.max(0, downDif + S0*mu*eSun);
}
function irradiance(mu, tau){   // mu = sin(elevation)
  // twilight: fade out the two-stream sky at the clamped low-sun value, so it is continuous at the
  // horizon and follows τ (a dusty sky is dark at sunset too; the old fixed 1.2 % of S₀ ignored τ)
  if (mu <= 0) { const tw = dustTwoStreamDown(0.035, tau)*THREE.MathUtils.smoothstep(mu, -0.3, 0); return {dni:0, dir:0, dif:tw, glob:tw}; }
  const m = Math.max(mu, 0.035), tr = Math.exp(-tau/m);
  const dni = S0*tr, dir = dni*m;
  // Diffuse = two-stream global minus the unscattered beam. At τ ≤ 1 this stays
  // close to the old 0.75·S₀μ(1−e^{−τ/μ}) fit; at τ ≈ 11 it no longer saturates
  // at 75 % of TOA (that fit stayed bright even in a global storm).
  const glob = dustTwoStreamDown(m, tau), dif = Math.max(0, glob - dir);
  return { dni, dir, dif, glob: dir + dif };
}
const LUM_EFF = 100;  // lm/W, broadband sunlight
const PAR_PER_W = 2.06; // µmol photons PAR per J of broadband sunlight

// ============================================================================
//  RENDERER / SCENE
// ============================================================================
const params = {
  height: 22.0, layers: 8, pillows: true, platform: true, tunnels: false, tunnelSpacing: 10, funnelCover: 100, perfOpen: 20, membrane: true, tethers: true, cutaway: true, cutEighth: false, labels: true,
  time: 11.0, pathLights: 'auto', lat: 35.23, lon: 163.95, decl: 0, tau: 0.5, exposure: 1.0, view: 'overview', ledW: 0, ledHours: 16, ledAuto: true, ledMix620: 0.6,
};
const qs = new URLSearchParams(location.search);
for (const [k,v] of qs) if (k in params) params[k] = (typeof params[k]==='number') ? parseFloat(v) : (typeof params[k]==='boolean' ? v==='1'||v==='true' : v);
// info=0 hides the panel (handled later). info=summary | info=full selects the left-panel mode; default is Summary (for sharing).
let infoMode = 'summary';
{ const q = qs.get('info'); if (q==='full' || q==='physics') infoMode = 'full'; else if (q==='summary') infoMode = 'summary'; }

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
RectAreaLightUniformsLib.init();
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style,{position:'absolute',top:'0',left:'0',pointerEvents:'none'});
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb08060, 0.0016);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 3000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// shared uniforms for "light passed through water" on interior materials
const TINT = { dir: { value: new THREE.Color(1,1,1) }, dif: { value: new THREE.Color(1,1,1) } };

function poolOuterRect(gap=0){

// Closed water box. waves: subdivided top with 4–10 mm displacement (path-trace bake only).
function poolWaterBoxGeometry(w, d, h, waves){

  const wave = (x,z) => waves ? 0.008*(Math.sin(x*5.3+0.6)*Math.cos(z*4.1) + 0.45*Math.sin(x*8.8-z*6.4+1.2)) : 0;

  const vert = (x,y,z) => { pos.push(x,y,z); return pos.length/3-1; };
  const top = [], bot = [];
  for (let k=0;k<=nz;k++){
    top[k]=[]; bot[k]=[];
    const z = -d/2 + d*k/nz;
    for (let i=0;i<=nx;i++){
      const x = -w/2 + w*i/nx;
      top[k][i] = vert(x, y1+wave(x,z), z);
      bot[k][i] = vert(x, y0, z);
    }
  }
  for (let k=0;k<nz;k++) for (let i=0;i<nx;i++){
    const a=top[k][i], b=top[k][i+1], c=top[k+1][i], e=top[k+1][i+1];
    idx.push(a,c,b, b,c,e);
    const a2=bot[k][i], b2=bot[k][i+1], c2=bot[k+1][i], e2=bot[k+1][i+1];
    idx.push(a2,b2,c2, b2,e2,c2);
  }
  // sides, CCW when viewed from outside
  for (let i=0;i<nx;i++){ // −Z
    const t0=top[0][i], t1=top[0][i+1], b0=bot[0][i], b1=bot[0][i+1];
    idx.push(b0,b1,t1, b0,t1,t0);
  }
  for (let i=0;i<nx;i++){ // +Z
    const k=nz, t0=top[k][i], t1=top[k][i+1], b0=bot[k][i], b1=bot[k][i+1];
    idx.push(b1,b0,t0, b1,t0,t1);
  }
  for (let k=0;k<nz;k++){ // −X
    const t0=top[k][0], t1=top[k+1][0], b0=bot[k][0], b1=bot[k+1][0];
    idx.push(b1,b0,t0, b1,t0,t1);
  }
  for (let k=0;k<nz;k++){ // +X
    const i=nx, t0=top[k][i], t1=top[k+1][i], b0=bot[k][i], b1=bot[k+1][i];
    idx.push(b0,b1,t1, b0,t1,t0);
  }

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);

}

    <div class="src">Two-channel luminous ceiling just under the pillow stack. LEDs span the underside of the pillow canopy (${fmt(canopyA,0)} m²), which is the grid of pillow cells — less than the dome footprint (${fmt(footprintA,0)} m²) because the edge arc has no pillows where the membrane is too low. The top slider is total optical W/m² at floor level (area-light intensity is compensated for ceiling height). The mix slider is the fraction of those watts at 620 nm (the rest is 660 nm); default 60 % 620 nm / 40 % 660 nm: 620 nm does the white balance, 660 nm adds photosynthetic photons so the LED share of the DLI does not vanish when only a little red is needed. 620 nm is orange-red: closer to the eye’s red, much higher luminous efficacy (this model’s CIE 1931 ȳ(620 nm)×683 = 255 lm/W; CIE V(620) ≈ 0.381 → 260 lm/W) and about 5.2× more effective per watt in the sRGB red channel, so it does the work of visual white balance and colour rendering. 660 nm is deep red: closest to the chlorophyll absorption peak, slightly more photons per joule (5.52 vs 5.18 µmol/J) and a higher wall-plug efficiency. Units: the colour solver counts each linear-sRGB channel in sun-equivalent watts, 1 unit = the R (G, B) stimulus of 1 W/m² of broadband 5778 K sunlight (all wavelengths; only ~38 % of it is in 400–700 nm). Unfiltered sunlight of I W/m² is therefore (I, I, I) and has red share 1/3. One optical W/m² of LED light at λ adds CMF→sRGB(λ) ÷ (the sun’s stimulus per broadband W): R = ${fmt(LED_CH[620].r,1)} at 620 nm and ${fmt(LED_CH[660].r,2)} at 660 nm (its small negative G/B, outside the sRGB gamut, is clipped to 0). The rendered LED light uses the same numbers: colour = that R:G:B, floor irradiance = W × R × 3.2/S₀ on the sun’s render scale (3.2 ≡ S₀ W/m²), and the interior sky light is put on the same scale, so the 3D view shows the colour the panel reports. Auto-balance (white, Duv = 0): solver channels × the sun’s per-W stimulus → absolute linear sRGB → CIE XYZ, plus the LED l // presets scale with the current geometry (k: footprint, h: height relative to the 13 m reference; H0/R0 stay at that framing, not the 22 m startup default)
const VIEWS = {
  overview: (k,h)=>({ pos:[30*k, 13*h, 38*k], tgt:[-3, 6*h, -6], cut:true }),
  section:  (k,h)=>({ pos:[0.5, 6.0*h, 13*Math.max(1,h*0.8)], tgt:[-7.5, G.H*0.72, -2], cut:true }),
  interior: (k,h)=>({ pos:[2.0, 1.65, 1.5], tgt:[-0.5, 5.2, -9], cut:false, fov:68 }),
  exterior: (k,h)=>({ pos:[46*k, 17*h, 50*k], tgt:[0, 4*h, 0], cut:false }),
  house:    (k,h)=>({ pos:[-8.2, 5.6, -3.6], tgt:[-10, 3.9, -10], cut:false }),
  funnel:   (k,h)=>({ pos:[7.5, G.H-4.2, 9.5], tgt:[0, G.H-1.6, 0], cut:true }),   // close-up of a tunnel funnel in section
  platform: (k,h)=>{ const y = platformDeckY(Math.max(plateauClearHeight(), 26));
    return { pos:[16.5, y+2.6, 12.5], tgt:[0.2, y+1.4, -0.6], cut:false, fov:50 }; },
};
function applyCamera(name){
  const f = VIEWS[name]; if (!f) return null; const v = f(G.R/R0, G.H/H0);
  camera.position.set(...v.pos); controls.target.set(...v.tgt); camera.fov = v.fov || 50; camera.updateProjectionMatrix(); controls.update();
  return v;
}
function setView(name){
  const v = applyCamera(name); if (!v) return;
  if (!params.cutEighth) params.cutaway = v.cut;
  gui?.controllersRecursive().forEach(c=>c.updateDisplay());
  rebuild();
}
// ---------------------------------------------------------------- loading overlay
const loadingEl = document.getElementById('loading'), loadBar = loadingEl.querySelector('.bar i'), loadMsg = loadingEl.querySelector('.msg');
const HOLD_LOADING = qs.get('loading') === 'hold';
const nextPaint = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));   // let the overlay paint before sync work
async function step(msg, frac, fn){ loadMsg.textContent = msg; loadBar.style.width = Math.round(frac*100)+'%'; await nextPaint(); fn && fn(); }
let queue = Promise.resolve();
function withLoading(kind, steps){
  queue = queue.then(async () => {
    loadingEl.className = kind; loadingEl.style.display = 'flex';
    for (const [msg, frac, fn] of steps) await step(msg, frac, fn);
    await step('Done', 1, null);
    if (!HOLD_LOADING) loadingEl.style.display = 'none';
  }).catch(e => { console.error(e); loadingEl.style.display = 'none'; });
  return queue;
}
const structureSteps = () => [
  ['Shaping terrain', 0.1, () => { setHeight(params.height); updateGround(); placeRocks(); }],
  [`Building membrane & edge arc (${fmtH(params.height)} m)`, 0.35, buildMembrane],
  ['Laying out pillow grid', 0.6, () => { computeCells(cells); buildAnchors(); buildScaleBar(); }],
  ['Hanging water pillows & tethers', 0.85, rebuild],
];
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const rebuildHeight = debounce(() => withLoading('rebuild', [...structureSteps(),
  ['Adjusting camera', 0.95, () => { if (['overview','exterior','section','platform'].includes(params.view)) applyCamera(params.view); }]]), 350);
function rebuildStructure(){
  setHeight(params.height); updateGround(); placeRocks();
  buildMembrane(); computeCells(cells); buildAnchors(); buildScaleBar();
  if (['overview','exterior','section','platform'].includes(params.view)) applyCamera(params.view);

  console.log('path trace scene', pt.stats);
}
function stopPathTrace(){
  pt.enabled = false;
  pt.building = false;
  if (pt.pendingQuery && pt.gl){ try { pt.gl.deleteQuery(pt.pendingQuery); } catch(e){} }
  pt.pendingQuery = null;
  if (pt.pathTracer){ try { pt.pathTracer.reset(); } catch(e){} }
  setPtStats('');
  if (ptStatsEl) ptStatsEl.style.display = 'none';
  if (ptCtl) { ptCtl.enabled = false; gui?.controllersRecursive().forEach(c=>c.updateDisplay()); }
}
function ptOnRebuild(){
  if (pt.enabled || pt.building) startPathTrace();
}
window.__pt = pt;
ptHook = ptSyncLighting;
pt.start = startPathTrace;
pt.stop = stopPathTrace;

// Cooperative scheduling (no gl.finish):
// PathTracingRenderer.update() already traces one scissored tile per call, then yields.
// We submit at most one tile per animation frame. A tile is still a single
// non-preemptible draw, so the budget only controls how often we submit, not
// mid-tile work. If EXT_disjoint_timer_query_webgl2 is present, the last tile's
// GPU time is read asynchronously (one frame late) and the next submit is delayed
// so average GPU load stays near budgetMs per 16.7 ms. Without the extension, we
// use a conservative heuristic: assume GPU time is at least max(cpuMs, 8 ms) × 2
// and skip frames the same way.
const PT_FRAME_MS = 1000 / 60;
let cPtTrans = null;
function applyPtTiles(reset=true){
  const n = Math.max(1, Math.min(16, Math.round(pt.tiles)));
  pt.tiles = n;
  if (pt.pathTracer){
    pt.pathTracer.tiles.set(n, n);
    if (reset) pt.pathTracer.reset();
  }
}
function applyPtBounces(reset=true){
  if (!pt.pathTracer) return;
  pt.pathTracer.bounces = pt.bounces;
  if (reset) pt.pathTracer.reset();
}
// In three-gpu-pathtracer 0.0.23, transmissiveBounces is an extra allowance of
// transmissive surface crossings (refraction / travel through a medium). The
// shader decrements the path-loop index so these steps do not consume the
// regular `bounces` budget. It is not a total path-length cap and not a subset
// of `bounces`. Two interfaces per water pillow, so 8 layers need ~16+.
function applyPtTransBounces(reset=true){
  if (pt.transAuto){
    const L = params.pillows ? params.layers : 0;
    pt.transmissiveBounces = Math.max(16, 2*L);
    cPtTrans?.updateDisplay();
  }
  if (!pt.pathTracer) return;
  pt.pathTracer.transmissiveBounces = pt.useTransmission ? pt.transmissiveBounces : 0;
  if (reset) pt.pathTracer.reset();
}
function ptIsPaused(){
  return document.hidden || (pt.pauseUnfocused && pt.unfocused);
}
function ptEnsureTimer(){
  if (pt.timerChecked) return;
  pt.timerChecked = true;
  const gl = renderer.getContext();
  pt.gl = gl;
  pt.timerExt = (typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext)
    ? gl.getExtension('EXT_disjoint_timer_query_webgl2') : null;
}
function ptBeginGpuQuery(){
  if (!pt.timerExt || !pt.gl || pt.pendingQuery) return;
  const gl = pt.gl, ext = pt.timerExt;
  try {
    if (gl.getQuery(ext.TIME_ELAPSED_EXT, gl.CURRENT_QUERY)) return;
    const q = gl.createQuery();
    gl.beginQuery(ext.TIME_ELAPSED_EXT, q);
    if (gl.getQuery(ext.TIME_ELAPSED_EXT, gl.CURRENT_QUERY) !== q){
      try { gl.deleteQuery(q); } catch (e) {}
      return;
    }
    pt.pendingQuery = q;
  } catch (e) { pt.pendingQuery = null; }
}
function ptEndGpuQuery(){
  if (!pt.timerExt || !pt.gl || !pt.pendingQuery) return;
  const gl = pt.gl, ext = pt.timerExt;
  try {
    if (gl.getQuery(ext.TIME_ELAPSED_EXT, gl.CURRENT_QUERY) === pt.pendingQuery){
      gl.endQuery(ext.TIME_ELAPSED_EXT);
    }
  } catch (e) { try { gl.deleteQuery(pt.pendingQuery); } catch (e2) {} pt.pendingQuery = null; }
}
function ptTrustGpuMs(ms){
  // Discard empty/broken timer results (some software GL reports ~0).
  return Number.isFinite(ms) && ms >= 0.1;
}
function ptPollGpuQuery(){
  if (!pt.timerExt || !pt.gl || !pt.pendingQuery) return;
  const gl = pt.gl, q = pt.pendingQuery;
  try {
    if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) return;
    const disjoint = gl.getParameter(pt.timerExt.GPU_DISJOINT_EXT);
    if (!disjoint){
      const ms = gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6;
      if (ptTrustGpuMs(ms)){
        pt.lastGpuMs = ms;
        if (pt.lastSubmitAt){
          const period = pt.lastGpuMs * (PT_FRAME_MS / Math.max(pt.budgetMs, 1));
          pt.nextSubmitAt = pt.lastSubmitAt + period;
        }
      }
    }
    gl.deleteQuery(q);
  } catch (e) {
    try { gl.deleteQuery(q); } catch (e2) {}
  }
  pt.pendingQuery = null;
}
function ptPresentOnly(ptr){
  const prev = ptr.pausePathTracing;
  ptr.pausePathTracing = true;
  ptr.renderSample();
  ptr.pausePathTracing = prev;
}
function tickPathTrace(){
  const ptr = pt.pathTracer;
  if (!ptr || !pt.enabled || pt.building) return;
  const key = ptCamKey();
  if (key !== pt.lastCam){
    pt.lastCam = key;
    ptr.updateCamera();
    pt.nextSubmitAt = 0;
  }
  const paused = ptIsPaused();
  const now = performance.now();
  if (paused){
    ptPresentOnly(ptr);
  } else {
    ptPollGpuQuery();
    if (now >= pt.nextSubmitAt){
      ptEnsureTimer();
      const t0 = performance.now();
      ptBeginGpuQuery();
      ptr.pausePathTracing = false;
      try { ptr.renderSample(); } finally { ptEndGpuQuery(); }
      pt.lastCpuMs = performance.now() - t0;
      pt.lastSubmitAt = t0;
      // Ignore one-shot stalls (shader compile) so they do not schedule a long skip.
      if (ptr.isCompiling || pt.lastCpuMs > 80){
        pt.nextSubmitAt = 0;
      } else {
        const assumedMs = ptTrustGpuMs(pt.lastGpuMs) ? pt.lastGpuMs : Math.max(pt.lastCpuMs, 8) * (pt.timerExt ? 1 : 2);
        pt.nextSubmitAt = t0 + assumedMs * (PT_FRAME_MS / Math.max(pt.budgetMs, 1));
      }
    } else {
      ptPresentOnly(ptr);
    }
  }
  const samples = ptr.samples || 0;
  const compiling = ptr.isCompiling ? ' · compiling shaders' : '';
  const pauseLbl = paused ? ' · paused' : '';
  const spp = Number.isInteger(samples) ? samples : Math.round(samples * 100) / 100;
  setPtStats(`Path trace · ${spp} sample${samples===1?'':'s'}${pauseLbl}${compiling} · ${Math.round(pt.stats.triangles).toLocaleString()} tris`);
}

const ptCtl = { enabled: false };
const fPT = gui.addFolder('Path trace');
fPT.add(ptCtl, 'enabled').name('Path trace').onChange(v => {
  if (v) startPathTrace(); else stopPathTrace();
  ptCtl.enabled = pt.enabled;
});
fPT.add(pt, 'tiles', 1, 16, 1).name('tiles').onChange(() => applyPtTiles(true));
fPT.add(pt, 'budgetMs', 4, 48, 1).name('GPU budget (ms)');
fPT.add(pt, 'bounces', 1, 64, 1).name('bounces').onChange(() => applyPtBounces(true));
cPtTrans = fPT.add(pt, 'transmissiveBounces', 0, 64, 1).name('transmissive bounces').onChange(() => { pt.transAuto = false; applyPtTransBounces(true); });
fPT.add(pt, 'pauseUnfocused').name('pause when unfocused');

window.addEventListener('blur', () => { pt.unfocused = true; });
window.addEventListener('focus', () => { pt.unfocused = false; });


document.getElementById('hide').onclick = () => { const i=document.getElementById('info'); i.style.display = i.style.display==='none'?'':'none'; };
document.getElementById('infoToggle').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]'); if (!b) return;
  setInfoMode(b.dataset.mode);
});
applyInfoModeChrome();
addEventListener('keydown', e => { if (e.key==='i' && !e.ctrlKey && !e.metaKey && !e.altKey && !flyTyping()) document.getElementById('hide').onclick(); });

// WASD noclip (Quake-style): fly along the camera view, no clip, no gravity.
// Camera and orbit target move by the same delta so OrbitControls keeps working.
const FLY_SPEED = 5, FLY_SPRINT = 4;
const flyKeys = Object.create(null);
const flyForward = new THREE.Vector3(), flyRight = new THREE.Vector3(), flyDelta = new THREE.Vector3();
let flyLastT = 0;
const FLY_BIND = {
  KeyW:'w', KeyS:'s', KeyA:'a', KeyD:'d',
  KeyQ:'q', KeyE:'e',
  Space:'up', ControlLeft:'down', ControlRight:'down',
  ShiftLeft:'shift', ShiftRight:'shift',
};
function flyTyping(){
  const el = document.activeElement;
  if (!el || el === document.body || el === document.documentElement) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}
function onFlyKey(e, down){
  const name = FLY_BIND[e.code];
  if (!name) return;
  if (!down){ flyKeys[name] = false; return; }   // always release, so nothing sticks
  if (flyTyping()) return;
  // leave browser shortcuts alone (Ctrl/Cmd+A, Ctrl+S, Alt+…); Ctrl itself is still "down"
  if ((e.metaKey || e.altKey || e.ctrlKey) && name !== 'down') return;
  if (name === 'up' || name === 'w' || name === 's' || name === 'a' || name === 'd' || name === 'q' || name === 'e') e.preventDefault();
  flyKeys[name] = down;
}
addEventListener('keydown', e => onFlyKey(e, true));
addEventListener('keyup', e => onFlyKey(e, false));
function flyClearKeys(){ for (const k of Object.keys(flyKeys)) flyKeys[k] = false; }
window.addEventListener('blur', flyClearKeys);
renderer.domElement.addEventListener('pointerdown', () => { if (flyTyping()) document.activeElement.blur(); });
if (window.__mars){ window.__mars.flyKeys = flyKeys; window.__mars.tickFly = tickFly; }
function tickFly(now){
  const dt = flyLastT ? Math.min(0.05, (now - flyLastT) / 1000) : 0;
  flyLastT = now;
  const k = flyKeys;
  const x = (k.d?1:0) - (k.a?1:0);
  const y = (k.e?1:0) + (k.up?1:0) - (k.q?1:0) - (k.down?1:0);
  const z = (k.w?1:0) - (k.s?1:0);
  if (!x && !y && !z) return;
  camera.getWorldDirection(flyForward);
  flyRight.crossVectors(flyForward, camera.up);
  if (flyRight.lengthSq() < 1e-8) flyRight.setFromMatrixColumn(camera.matrixWorld, 0);
  flyRight.normalize();
  flyDelta.set(0,0,0);
  if (z) flyDelta.addScaledVector(flyForward, z);
  if (x) flyDelta.addScaledVector(flyRight, x);
  if (y) flyDelta.y += y;
  if (flyDelta.lengthSq() < 1e-12) return;
  flyDelta.normalize().multiplyScalar(FLY_SPEED * (k.shift ? FLY_SPRINT : 1) * dt);
  camera.position.add(flyDelta);
  controls.target.add(flyDelta);
}
addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
  if (pt.enabled && pt.pathTracer) pt.pathTracer.updateCamera(); });

const cutOverride = qs.has('cutaway') ? params.cutaway : null;
const eighthFromUrl = qs.has('cutEighth') ? params.cutEighth : false;
params.height = THREE.MathUtils.clamp(params.height, H_MIN, H_MAX);
params.layers = THREE.MathUtils.clamp(Math.round(params.layers), 0, MAXL);
if (qs.get('gui')==='0') gui.hide();
if (qs.get('info')==='0') document.getElementById('info').style.display='none';
loadingEl.className = '';
withLoading('', [...structureSteps(), ['Placing camera', 0.95, () => {
    setHeight(params.height); const v = applyCamera(params.view) || applyCamera('overview');
    params.cutaway = cutOverride !== null ? cutOverride : v.cut;
    if (eighthFromUrl){ params.cutEighth = true; params.cutaway = true; }
    gui.controllersRecursive().forEach(c=>c.updateDisplay()); rebuild(); }]])
  .then(() => {
    let frames = 0;
    const autoPT = qs.get('pathTrace')==='1' || qs.get('pathTrace')==='true';
    renderer.setAnimationLoop(() => {
      tickFly(performance.now());
      controls.update();
      if (pt.enabled) tickPathTrace();
      else renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      if (++frames === 3){
        window.__ready = true;
        if (autoPT && !pt.enabled && !pt.building) startPathTrace();
      }
    });
  });
</script>
</body>
</html>
